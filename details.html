<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="./css/style.css" />
    <script src="./script.js" defer></script>
    <title>Jules Botté-Magalhaes - Partiel Harry Potter</title>
  </head>
  <body class="page_perso">
    <header class="header">
      <div class="header__right">
        <a href="index.html">
        <img src="./images/logo.png" />
    </a>
 </div>
      <div class="header__left">
        <h1>Jules Botté-Magalhaes - Partiel Harry Potter</h1>
        <button type="button" id="menu-bouton">
          <img src="./images/menu.png" alt="Menu" />
        </button>
      </div>
    </header>
    <ul id="menu-liste">
      <li>Maisons</li>
      <li>Sorts</li>
      <li>Contact</li>
      <li>Gallerie</li>
    </ul>
    <main>
      <section>
        <h3 id="nom">Chargement...</h3>
        <div class="perso">
          <figure class="perso__left">
            <img id="photo" src="./images/logo.png" alt="Portrait du personnage" />
            <figcaption id="acteur">Non renseigné</figcaption>
          </figure>
          <div class="perso__right">
            <div>
              <p>Nicknames</p>
              <p class="attr" id="surnoms">Aucun surnom</p>
            </div>
            <div>
              <p>Gender</p>
              <p class="attr" id="genre">Non renseigné</p>
            </div>
            <div>
              <p>Eye</p>
              <p class="attr" id="yeux">Non renseigné</p>
            </div>
            <div>
              <p>Hair</p>
              <p class="attr" id="cheveux">Non renseigné</p>
            </div>
            <div>
              <p>Date of birth</p>
              <p class="attr" id="naissance">Non renseigné</p>
            </div>
            <div>
              <p>Patronus</p>
              <p class="attr" id="patronus">Non renseigné</p>
            </div>
          </div>
        </div>
      </section>
      <section class="house__perso">
        <img alt="Maison du personnage" />
      </section>
    </main>
    <footer>
      <p>Wiki Happy Potter is a FANDOM community</p>
    </footer>
  </body>
</html>
